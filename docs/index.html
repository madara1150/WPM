<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JUST TYPE: ฝึกพิมพ์ไทย อังกฤษ และภาษา C</title>
  <meta name="description" content="เกมฝึกพิมพ์สัมผัส วัด WPM แข่งกับเงาสถิติของตัวเอง ฝึกปุ่มที่พลาดบ่อย และเล่นเกมฝนคำ">
  <meta name="theme-color" content="#16120f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2316120f'/%3E%3Crect x='7' y='21' width='18' height='4' fill='%23ff7a2f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app/css/app.css">
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>

  <header class="top">
    <a class="brand" href="#type" aria-label="JUST TYPE หน้าแรก">JUST<span>TYPE</span><i></i></a>
    <nav aria-label="เมนูหลัก">
      <a href="#type" data-nav="type">พิมพ์</a>
      <a href="#rain" data-nav="rain">ฝนคำ</a>
      <a href="#stats" data-nav="stats">สถิติ</a>
      <a href="#settings" data-nav="settings">ตั้งค่า</a>
    </nav>
    <div class="streak" id="streak" title="จำนวนวันที่ฝึกติดต่อกัน"></div>
  </header>

  <main>
    <section id="view-type" class="view" aria-label="ทดสอบการพิมพ์">
      <div id="config" class="config"></div>
      <div id="notice" class="notice" hidden></div>

      <div id="stage" class="stage">
        <div class="live" aria-live="off">
          <span class="live-main" id="live-main">30</span>
          <span class="live-item"><b id="live-wpm">0</b> WPM</span>
          <span class="live-item"><b id="live-acc">100</b>%</span>
          <span class="live-ghost" id="live-ghost"></span>
        </div>
        <div id="text-wrap" class="text-wrap">
          <div id="text" class="text" aria-hidden="true">
            <div id="text-inner" class="text-inner"></div>
          </div>
          <input id="input" class="ghost-input" type="text" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="ช่องพิมพ์ข้อความ">
          <button id="focus-cover" class="focus-cover" type="button">คลิกตรงนี้หรือกดปุ่มใดก็ได้เพื่อพิมพ์ต่อ</button>
        </div>
        <div class="progress"><i id="progress"></i></div>
        <div class="hint-row">
          <span id="hint" class="hint" role="status"></span>
          <span id="finger" class="finger"></span>
        </div>
        <div id="keyboard" class="keyboard" aria-hidden="true"></div>
        <div class="stage-foot">
          <button id="restart" class="ghost-btn" type="button" title="เริ่มใหม่">เริ่มใหม่</button>
          <span class="shortcuts"><kbd>Tab</kbd> แล้ว <kbd>Enter</kbd> หรือ <kbd>Esc</kbd> เพื่อเริ่มใหม่ · เว้นวรรคเพื่อข้ามคำ · <kbd>Ctrl</kbd>+<kbd>⌫</kbd> ลบทั้งคำ</span>
        </div>
      </div>

      <div id="results" class="results" hidden></div>
    </section>

    <section id="view-rain" class="view" aria-label="เกมฝนคำ" hidden></section>
    <section id="view-stats" class="view" aria-label="สถิติ" hidden></section>
    <section id="view-settings" class="view" aria-label="ตั้งค่า" hidden></section>

    <noscript><p class="fatal">JUST TYPE ต้องเปิด JavaScript จึงจะเล่นได้</p></noscript>
    <p id="file-warning" class="fatal" hidden>เปิดไฟล์นี้ตรงๆ ไม่ได้ เพราะเบราว์เซอร์บล็อก ES module กรุณารัน <code>npm start</code> แล้วเปิด http://localhost:5173</p>
  </main>

  <footer class="foot">
    <span>Computer Programming Project · KMITL 2/2021</span>
    <a href="about.html">เกี่ยวกับโปรเจกต์</a>
  </footer>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <script>
    if (location.protocol === 'file:') {
      document.getElementById('file-warning').hidden = false;
      document.getElementById('view-type').hidden = true;
    }
  </script>
  <script type="module" src="app/js/main.js"></script>
</body>
</html>
